[project]
name = "wepeiyang-browse-agent"
version = "0.5.0"
description = "Read-only BlueStacks browser and collector for the WePeiYang forum."
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "jsonschema>=4.23", "qdrant-client>=1.14,<2", "sentence-transformers>=3,<6"]

[project.scripts]
wpy-agent = "wepeiyang_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wepeiyang_agent*"]

[tool.setuptools.package-data]
wepeiyang_agent = ["skills/*/SKILL.md", "assets/*.apk"]
