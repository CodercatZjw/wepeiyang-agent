[project]
name = "wepeiyang-browse-agent"
version = "0.1.0"
description = "Read-only BlueStacks browser and collector for the WePeiYang forum."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wpy-agent = "wepeiyang_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wepeiyang_agent*"]

